[package]
name = "judihunter-mcp"
version = "0.2.0"
edition = "2021"
description = "Advanced Indonesian gambling recon MCP server (cross-platform, memory-optimized, no API keys)"

[[bin]]
name = "judihunter-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
